<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - Smart Library</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #f5f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
}

.signup-container {
    width: 90%;
    max-width: 420px;
    background: white;
    padding: 35px 30px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

.logo {
    text-align: center;
    font-size: 42px;
    margin-bottom: 8px;
}

h1 {
    text-align: center;
    color: #1e293b;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #334155;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 13px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.login {
    text-align: center;
    margin-top: 20px;
    color: #64748b;
}

.login a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="signup-container">

    <div class="logo">📚</div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Join Smart Online Library
    </p>

    <form onsubmit="signupUser(event)">

        <label>Full Name</label>
        <input 
            type="text" 
            id="name" 
            placeholder="Enter your full name" 
            required
        >

        <label>Email</label>
        <input 
            type="email" 
            id="email" 
            placeholder="Enter your email" 
            required
        >

        <label>Password</label>
        <input 
            type="password" 
            id="password" 
            placeholder="Create a password" 
            required
        >

        <label>Confirm Password</label>
        <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Confirm your password" 
            required
        >

        <button type="submit">Create Account</button>

    </form>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>
