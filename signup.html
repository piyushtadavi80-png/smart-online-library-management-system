<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Library - Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 45px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      color: #1e293b;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
    }

    .login a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">📚</div>

    <h1>Create Account</h1>

    <p class="subtitle">Join Smart Library</p>

    <form onsubmit="signup(event)">

      <label>Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
      >

      <button type="submit">Sign Up</button>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

  <script>
    function signup(event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (name && email && password) {
        alert("Account created successfully!");
        window.location.href = "login.html";
      }
    }
  </script>

</body>
</html>
